<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HTML 改写结果对比</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 13px;
  background: #f0f0f0;
  color: #222;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: #1e293b;
  color: #e2e8f0;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#toolbar h1 { font-size: 13px; font-weight: 600; margin-right: 4px; color: #7dd3fc; }
#toolbar .sep { color: #475569; }
#toolbar label { font-size: 12px; color: #94a3b8; }
#toolbar select, #toolbar input[type=number] {
  background: #334155; border: 1px solid #475569; color: #e2e8f0;
  border-radius: 4px; padding: 2px 6px; font-size: 12px;
}
.btn {
  padding: 3px 10px; border-radius: 4px; border: none; cursor: pointer;
  font-size: 12px; font-weight: 500;
}
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-ghost { background: #334155; color: #e2e8f0; }
.btn-ghost:hover { background: #475569; }
.btn-danger { background: #dc2626; color: #fff; }
.btn-danger:hover { background: #b91c1c; }
#page-info { font-size: 12px; color: #94a3b8; min-width: 80px; text-align: center; }

/* ── Add column panel ────────────────────────────────────── */
#add-panel {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px;
  background: #0f172a;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
  flex-wrap: wrap;
}
#add-panel label { color: #94a3b8; font-size: 12px; }
#add-panel input[type=text], #add-panel input[type=number], #add-panel select {
  background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
  border-radius: 4px; padding: 3px 7px; font-size: 12px;
}
#add-panel input[type=text] { width: 340px; }

/* ── Main scroll area ────────────────────────────────────── */
#scroll-container {
  flex: 1;
  overflow: auto;
  padding: 0;
}

/* ── Table ───────────────────────────────────────────────── */
table {
  border-collapse: separate;
  border-spacing: 0;
  white-space: nowrap;
}
th, td {
  border-right: 1px solid #d1d5db;
  border-bottom: 1px solid #d1d5db;
  vertical-align: top;
  padding: 0;
}

/* ── Info column (fixed-left) ────────────────────────────── */
.col-info {
  width: 240px;
  min-width: 240px;
  position: sticky;
  left: 0;
  z-index: 10;
  background: #fff;
}
.col-info-header {
  background: #1e293b;
  color: #e2e8f0;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 2px solid #334155;
}
.info-cell {
  padding: 8px 10px;
  background: #fafafa;
  border-right: 2px solid #94a3b8;
  height: 100%;
}
.info-row-num {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
  margin-bottom: 2px;
}
.info-url {
  font-size: 11px;
  color: #2563eb;
  word-break: break-all;
  white-space: normal;
  margin-bottom: 4px;
  line-height: 1.4;
}
.info-url a { color: inherit; text-decoration: none; }
.info-url a:hover { text-decoration: underline; }
.info-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  background: #dbeafe;
  color: #1d4ed8;
  margin-bottom: 4px;
}
.info-stat {
  font-size: 10px;
  color: #6b7280;
  line-height: 1.6;
  white-space: normal;
}
.info-stat span { color: #374151; font-weight: 500; }
.open-live-btn {
  margin-top: 6px;
  display: inline-block;
  font-size: 11px;
  padding: 2px 8px;
  background: #f0fdf4;
  border: 1px solid #86efac;
  color: #16a34a;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
}
.open-live-btn:hover { background: #dcfce7; }

/* ── Data columns ────────────────────────────────────────── */
.col-data {
  width: 500px;
  min-width: 500px;
}
.col-header {
  background: #1e293b;
  color: #e2e8f0;
  padding: 6px 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid #334155;
  gap: 6px;
}
.col-header-label {
  font-size: 12px;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
.col-header-sub {
  font-size: 10px;
  color: #94a3b8;
  white-space: nowrap;
}
.col-remove-btn {
  background: none;
  border: none;
  color: #ef4444;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  padding: 0 2px;
  flex-shrink: 0;
}
.col-remove-btn:hover { color: #fca5a5; }

/* ── Render cell ─────────────────────────────────────────── */
.render-cell {
  padding: 8px;
  background: #fff;
}
.render-frame-wrap {
  position: relative;
  width: 100%;
  height: 480px;
  border: 1px solid #e5e7eb;
  border-radius: 4px;
  overflow: hidden;
  background: #fafafa;
}
.render-frame-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.render-missing {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 480px;
  color: #9ca3af;
  font-size: 13px;
  border: 1px dashed #d1d5db;
  border-radius: 4px;
}
.cell-meta {
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.cell-badge {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
}
.badge-preprocessed { background: #fef9c3; color: #854d0e; }
.badge-output       { background: #dcfce7; color: #166534; }
.badge-finish       { background: #f3f4f6; color: #374151; }
.cell-tokens {
  font-size: 10px;
  color: #6b7280;
}
.cell-htmllen {
  font-size: 10px;
  color: #9ca3af;
  margin-left: auto;
}
.open-tab-btn {
  font-size: 11px;
  padding: 2px 8px;
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  flex-shrink: 0;
}
.open-tab-btn:hover { background: #dbeafe; }

/* ── Loading / empty ─────────────────────────────────────── */
#loading {
  display: none;
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,.6);
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 999;
}
#empty-msg {
  display: none;
  padding: 60px;
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
}
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <h1>HTML 改写对比</h1>
  <span class="sep">|</span>
  <label>每页</label>
  <select id="page-size">
    <option value="5">5</option>
    <option value="10" selected>10</option>
    <option value="20">20</option>
    <option value="50">50</option>
  </select>
  <button class="btn btn-ghost" id="btn-prev">‹ 上一页</button>
  <span id="page-info">—</span>
  <button class="btn btn-ghost" id="btn-next">下一页 ›</button>
  <span class="sep">|</span>
  <span id="col-count" style="font-size:12px;color:#94a3b8;"></span>
</div>

<!-- Add column panel -->
<div id="add-panel">
  <label>＋ 添加列：</label>
  <input type="text" id="add-path" placeholder="JSONL 文件绝对路径">
  <select id="add-field">
    <option value="output_html">output_html</option>
    <option value="preprocessed_html">preprocessed_html</option>
  </select>
  <input type="number" id="add-n" value="50" min="-1" style="width:70px" title="加载条数（-1=全部）">
  <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
    <input type="checkbox" id="add-random"> 随机采样
  </label>
  <input type="text" id="add-label" placeholder="列标签（可选）" style="width:160px">
  <button class="btn btn-primary" id="btn-add-col">添加</button>
</div>

<div id="loading">加载中…</div>
<div id="empty-msg">暂无数据。请通过命令行 --jsonl 参数加载文件，或在上方添加列。</div>

<div id="scroll-container">
  <table id="main-table">
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let state = {
  columns: [],
  rowCount: 0,
  page: 0,
  pageSize: 10,
};

// ── API ────────────────────────────────────────────────────────────────────
async function apiFetch(path, opts) {
  const resp = await fetch(path, opts);
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({ error: resp.statusText }));
    throw new Error(err.error || resp.statusText);
  }
  return resp.json();
}

// ── Utilities ──────────────────────────────────────────────────────────────
function truncateUrl(url, n = 60) {
  return url && url.length > n ? url.slice(0, n) + '…' : (url || '');
}
function fmtNum(n) {
  return n == null ? '—' : Number(n).toLocaleString();
}
function fmtKB(bytes) {
  return bytes == null ? '—' : (bytes / 1024).toFixed(1) + ' KB';
}

// ── Render ─────────────────────────────────────────────────────────────────
function buildHeader(columns) {
  const tr = document.createElement('tr');

  // Fixed info column header
  const th0 = document.createElement('th');
  th0.className = 'col-info';
  th0.innerHTML = `<div class="col-info-header">页面信息 <span style="font-weight:400;color:#64748b">(${state.rowCount} 条)</span></div>`;
  tr.appendChild(th0);

  // Data columns
  columns.forEach((col, i) => {
    const th = document.createElement('th');
    th.className = 'col-data';
    const fieldBadge = col.field === 'preprocessed_html'
      ? '<span class="cell-badge badge-preprocessed">preprocessed</span>'
      : '<span class="cell-badge badge-output">output</span>';
    th.innerHTML = `
      <div class="col-header">
        <div style="flex:1;min-width:0">
          <div class="col-header-label" title="${col.path}">${col.label}</div>
          <div class="col-header-sub">${fieldBadge} &nbsp;${col.loaded.toLocaleString()} / ${col.total_in_file.toLocaleString()} 条</div>
        </div>
        <button class="col-remove-btn" title="删除此列" data-col-idx="${col.idx}">✕</button>
      </div>`;
    tr.appendChild(th);
  });

  document.getElementById('table-head').innerHTML = '';
  document.getElementById('table-head').appendChild(tr);

  // Bind remove buttons
  document.querySelectorAll('.col-remove-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.colIdx, 10);
      await removeColumn(idx);
    });
  });
}

function buildRows(rows) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  rows.forEach(row => {
    const tr = document.createElement('tr');
    const m = row.meta || {};
    const stats = m.preprocess_stats || {};
    const url = m.url || row.id || '';
    const pageTypes = (m.page_type || []).join(', ') || '—';

    // ── Info cell ──────────────────────────────────────────────
    const tdInfo = document.createElement('td');
    tdInfo.className = 'col-info';
    tdInfo.innerHTML = `
      <div class="info-cell">
        <div class="info-row-num">#${row.row_idx + 1}</div>
        <div class="info-url" title="${url}">
          <a href="${url}" target="_blank" rel="noopener">${truncateUrl(url, 55)}</a>
        </div>
        <div class="info-badge">${pageTypes}</div>
        <div class="info-stat">
          原始: <span>${fmtKB(stats.original_chars)}</span>
          → 清洗后: <span>${fmtKB(stats.cleaned_chars)}</span>
          (${stats.compression_ratio != null ? (stats.compression_ratio * 100).toFixed(1) + '%' : '—'})<br>
          媒体: <span>${fmtNum(stats.media_total)}</span>
          (有尺寸 <span>${fmtNum(stats.media_with_size)}</span>)<br>
          script 截断: <span>${fmtNum(stats.script_truncated)}</span>
          &nbsp;style 截断: <span>${fmtNum(stats.style_truncated)}</span>
        </div>
        <a class="open-live-btn" href="${url}" target="_blank" rel="noopener">↗ 打开原站</a>
      </div>`;
    tr.appendChild(tdInfo);

    // ── Data cells (one per column) ───────────────────────────
    row.cells.forEach((cell, colRelIdx) => {
      const col = state.columns[colRelIdx];
      const td = document.createElement('td');
      td.className = 'col-data';

      if (!cell.has_html) {
        td.innerHTML = `<div class="render-cell"><div class="render-missing">— 无数据 —</div></div>`;
      } else {
        const renderUrl = `/render/${col.idx}/${row.row_idx}`;
        const fieldBadgeClass = col.field === 'preprocessed_html' ? 'badge-preprocessed' : 'badge-output';
        const fieldLabel = col.field === 'preprocessed_html' ? 'preprocessed' : 'output';
        const tokenInfo = (cell.prompt_tokens != null)
          ? `↑${fmtNum(cell.prompt_tokens)} ↓${fmtNum(cell.completion_tokens)}`
          : '';
        const finishBadge = cell.finish_reason
          ? `<span class="cell-badge badge-finish">${cell.finish_reason}</span>` : '';
        const modelText = cell.model ? `<span style="font-size:10px;color:#6b7280">${cell.model}</span>` : '';
        td.innerHTML = `
          <div class="render-cell">
            <div class="render-frame-wrap">
              <iframe src="${renderUrl}" loading="lazy"
                title="${col.label} — row ${row.row_idx + 1}"
                referrerpolicy="no-referrer-when-downgrade">
              </iframe>
            </div>
            <div class="cell-meta">
              <span class="cell-badge ${fieldBadgeClass}">${fieldLabel}</span>
              ${finishBadge}
              ${modelText}
              <span class="cell-tokens">${tokenInfo}</span>
              <span class="cell-htmllen">${fmtKB(cell.html_len)}</span>
              <a class="open-tab-btn" href="${renderUrl}" target="_blank" rel="noopener">↗ 新标签</a>
            </div>
          </div>`;
      }
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
}

// ── Load & refresh ─────────────────────────────────────────────────────────
async function loadInfo() {
  const info = await apiFetch('/api/info');
  state.columns = info.columns;
  state.rowCount = info.row_count;
  document.getElementById('col-count').textContent =
    `${state.columns.length} 列 · ${state.rowCount.toLocaleString()} 行`;
}

async function loadRows() {
  const rows = await apiFetch(
    `/api/rows?page=${state.page}&size=${state.pageSize}`
  );
  state.rowCount = rows.total_rows;
  updatePageInfo(rows.total_rows);
  buildHeader(state.columns);
  buildRows(rows.rows);

  const isEmpty = state.columns.length === 0;
  document.getElementById('empty-msg').style.display = isEmpty ? 'block' : 'none';
  document.getElementById('main-table').style.display = isEmpty ? 'none' : '';
}

async function refresh() {
  document.getElementById('loading').style.display = 'block';
  try {
    await loadInfo();
    await loadRows();
  } catch (e) {
    alert('加载失败: ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function updatePageInfo(total) {
  const totalPages = Math.max(1, Math.ceil(total / state.pageSize));
  document.getElementById('page-info').textContent =
    `第 ${state.page + 1} / ${totalPages} 页`;
  document.getElementById('btn-prev').disabled = state.page <= 0;
  document.getElementById('btn-next').disabled = state.page >= totalPages - 1;
}

// ── Column management ──────────────────────────────────────────────────────
async function removeColumn(idx) {
  if (!confirm(`确认删除第 ${idx + 1} 列？`)) return;
  try {
    await apiFetch(`/api/columns/${idx}`, { method: 'DELETE' });
    await refresh();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

async function addColumn() {
  const path = document.getElementById('add-path').value.trim();
  if (!path) { alert('请填写 JSONL 文件路径'); return; }
  const field = document.getElementById('add-field').value;
  const sampleN = parseInt(document.getElementById('add-n').value, 10);
  const isRandom = document.getElementById('add-random').checked;
  const label = document.getElementById('add-label').value.trim();
  try {
    document.getElementById('loading').style.display = 'block';
    await apiFetch('/api/columns', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, field, sample_n: sampleN, random: isRandom, label }),
    });
    document.getElementById('add-path').value = '';
    document.getElementById('add-label').value = '';
    state.page = 0;
    await refresh();
  } catch (e) {
    alert('添加失败: ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── Event bindings ─────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.page > 0) { state.page--; refresh(); }
});
document.getElementById('btn-next').addEventListener('click', () => {
  const totalPages = Math.ceil(state.rowCount / state.pageSize);
  if (state.page < totalPages - 1) { state.page++; refresh(); }
});
document.getElementById('page-size').addEventListener('change', e => {
  state.pageSize = parseInt(e.target.value, 10);
  state.page = 0;
  refresh();
});
document.getElementById('btn-add-col').addEventListener('click', addColumn);
document.getElementById('add-path').addEventListener('keydown', e => {
  if (e.key === 'Enter') addColumn();
});
document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  { document.getElementById('btn-prev').click(); }
  if (e.key === 'ArrowRight') { document.getElementById('btn-next').click(); }
});

// ── Init ───────────────────────────────────────────────────────────────────
refresh();
</script>
</body>
</html>
