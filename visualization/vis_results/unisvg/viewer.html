<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniSVG 实验结果对比</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; font-size: 13px; color: #212529; }

    /* ── Toolbar ── */
    #toolbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 7px 16px;
      background: #fff;
      border-bottom: 1px solid #dee2e6;
    }
    .app-title { font-weight: 700; font-size: 14px; color: #0d6efd; white-space: nowrap; }
    .toolbar-sep { width: 1px; height: 22px; background: #dee2e6; flex-shrink: 0; }
    .toolbar-label { color: #6c757d; white-space: nowrap; }
    #toolbar select {
      padding: 3px 6px; border: 1px solid #ced4da; border-radius: 4px;
      font-size: 12px; background: #fff; cursor: pointer;
    }
    .btn-page {
      padding: 3px 10px; border: 1px solid #ced4da; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 14px; line-height: 1;
    }
    .btn-page:disabled { opacity: 0.4; cursor: default; }
    .btn-page:not(:disabled):hover { background: #e9ecef; }
    #page-info { font-size: 12px; white-space: nowrap; min-width: 90px; text-align: center; }
    #row-count-badge {
      font-size: 11px; padding: 2px 8px;
      background: #e9ecef; border-radius: 10px; white-space: nowrap;
    }
    .btn-toggle {
      padding: 3px 12px; border: 1px solid #ced4da; border-radius: 4px;
      background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .btn-toggle:hover { background: #e9ecef; }
    .btn-toggle.on { background: #0d6efd; color: #fff; border-color: #0d6efd; }

    /* ── Table container ── */
    #table-outer {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #f5f6f8;
    }
    #compare-table { min-width: fit-content; }

    /* ── Column headers (sticky top) ── */
    #col-headers {
      display: flex;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #c8d0da;
      background: #f8f9fa;
    }

    /* Index corner cell: sticky top + sticky left */
    .hdr-idx {
      width: 58px; min-width: 58px; flex-shrink: 0;
      position: sticky; left: 0; z-index: 20;
      background: #e8edf5;
      border-right: 2px solid #c8d0da;
      padding: 8px 4px;
      font-weight: 600; font-size: 11px; color: #6c757d;
      display: flex; align-items: center; justify-content: center;
    }

    /* Column header cells */
    .hdr-col {
      width: 380px; min-width: 380px; flex-shrink: 0;
      padding: 9px 12px;
      background: #f8f9fa;
      border-right: 1px solid #dee2e6;
    }
    .hdr-col.hdr-gt { background: #eef2ff; border-right: 2px solid #c8d0da; }
    .col-name {
      font-weight: 700; font-size: 13px; color: #212529; margin-bottom: 3px;
    }
    .col-name-gt { color: #3d5afe; }
    .col-dir {
      font-size: 11px; color: #6c757d; font-family: 'Consolas', monospace;
      word-break: break-all; line-height: 1.4;
    }

    /* ── Data rows ── */
    .compare-row {
      display: flex;
      border-bottom: 3px solid #c8d0da;
      background: #fff;
    }

    /* Row index cell (sticky left) */
    .cell-idx {
      width: 58px; min-width: 58px; flex-shrink: 0;
      position: sticky; left: 0; z-index: 5;
      background: #f0f2f5;
      border-right: 2px solid #c8d0da;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #495057;
      padding: 4px;
    }

    /* Data cell */
    .cell-data {
      width: 380px; min-width: 380px; flex-shrink: 0;
      border-right: 1px solid #dee2e6;
      display: flex; flex-direction: column;
      background: #fff;
    }
    .cell-data.cell-gt {
      background: #fafbff;
      border-right: 2px solid #c8d0da;
    }

    /* ── Section: PNG preview ── */
    .section-png {
      height: 220px; flex-shrink: 0;
      background: #f4f5f7;
      border-bottom: 1px solid #e2e6ea;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 6px;
      position: relative;
    }
    .section-png img {
      max-width: 100%; max-height: 206px;
      width: auto; height: auto;
      display: block; object-fit: contain;
    }
    .section-png .no-img {
      color: #adb5bd; font-size: 12px; text-align: center; line-height: 1.8;
    }
    .section-label {
      position: absolute; top: 4px; left: 6px;
      font-size: 10px; color: #9da5b1; font-weight: 500;
      background: rgba(244,245,247,0.85); padding: 1px 5px; border-radius: 3px;
      pointer-events: none;
    }

    /* ── Section: SVG source code ── */
    .section-code {
      border-bottom: 1px solid #e2e6ea;
      background: #fff;
      overflow: hidden;
      transition: max-height 0.18s ease;
    }
    .section-code.expanded { max-height: 240px; overflow-y: auto; }
    .section-code.collapsed { max-height: 0 !important; border-bottom: none; }
    .code-header {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 8px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      position: sticky; top: 0; z-index: 1;
    }
    .code-filename {
      font-size: 11px; color: #6c757d; font-family: monospace; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-copy {
      padding: 1px 8px; border: 1px solid #ced4da; border-radius: 3px;
      background: #fff; cursor: pointer; font-size: 11px; color: #495057;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-copy:hover { background: #e9ecef; }
    .btn-copy.copied { background: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .code-pre {
      font-size: 11px; line-height: 1.55; font-family: 'Consolas', 'Monaco', monospace;
      white-space: pre-wrap; word-break: break-all;
      margin: 0; padding: 7px 10px; color: #2d3748;
    }

    /* ── Section: Live SVG render ── */
    .section-live {
      flex-shrink: 0;
      display: flex; flex-direction: column;
    }
    .section-live-header {
      font-size: 10px; color: #6c757d; font-weight: 500;
      padding: 3px 8px;
      background: #f0fff4;
      border-bottom: 1px solid #e2e6ea;
      border-top: 1px solid #e2e6ea;
    }
    .section-live iframe {
      width: 100%; height: 220px; border: none; display: block;
      background: #fff;
    }
    .section-live .no-svg {
      height: 220px;
      display: flex; align-items: center; justify-content: center;
      color: #adb5bd; font-size: 12px;
      background: #fafafa;
    }

    /* ── Empty/error states ── */
    .empty-state {
      padding: 60px 24px; text-align: center;
      color: #adb5bd; font-size: 14px; line-height: 1.8;
    }
    .empty-state-error { color: #dc3545; }

    /* ── Loading overlay ── */
    #loading-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(255,255,255,0.65);
      z-index: 100;
      align-items: center; justify-content: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 4px solid #dee2e6;
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Toolbar ── -->
  <div id="toolbar">
    <span class="app-title">UniSVG 结果对比</span>
    <div class="toolbar-sep"></div>

    <button id="btn-prev" class="btn-page" title="上一页 (←)">‹</button>
    <span id="page-info">—</span>
    <button id="btn-next" class="btn-page" title="下一页 (→)">›</button>
    <span id="row-count-badge">0 行</span>

    <div class="toolbar-sep"></div>

    <span class="toolbar-label">每页:</span>
    <select id="sel-page-size">
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
    </select>

    <div class="toolbar-sep"></div>

    <button id="btn-toggle-code" class="btn-toggle on" title="显示/隐藏 SVG 源码">SVG 源码</button>
    <button id="btn-toggle-live" class="btn-toggle on" title="显示/隐藏实时渲染">实时渲染</button>
  </div>

  <!-- ── Table ── -->
  <div id="table-outer">
    <div id="compare-table">
      <div id="col-headers"></div>
      <div id="table-body"></div>
    </div>
  </div>

  <!-- ── Loading overlay ── -->
  <div id="loading-overlay"><div class="spinner"></div></div>

</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════════════
const S = {
  columns:   [],    // [{label, dir}]  from /api/info
  rows:      [],    // current page rows from /api/rows
  page:      0,
  pageSize:  10,
  totalRows: 0,
  showCode:  true,
  showLive:  true,
};

// ════════════════════════════════════════════════════════════════════════════
// Bootstrap
// ════════════════════════════════════════════════════════════════════════════
async function init() {
  try {
    const info = await fetchJSON('/api/info');
    S.columns   = info.columns;
    S.totalRows = info.total_rows;
    renderHeaders();
    await loadPage();
  } catch (err) {
    showFatalError('初始化失败: ' + err.message);
  }
}

// ════════════════════════════════════════════════════════════════════════════
// API helpers
// ════════════════════════════════════════════════════════════════════════════
async function fetchJSON(url, opts) {
  const r = await fetch(url, opts || {});
  if (!r.ok) {
    const body = await r.json().catch(() => ({ error: r.statusText }));
    throw new Error(body.error || r.statusText);
  }
  return r.json();
}

// ════════════════════════════════════════════════════════════════════════════
// Page loading
// ════════════════════════════════════════════════════════════════════════════
async function loadPage() {
  setLoading(true);
  try {
    const data = await fetchJSON(`/api/rows?page=${S.page}&size=${S.pageSize}`);
    S.rows      = data.rows;
    S.totalRows = data.total_rows;
    renderRows();
    updatePagination();
  } catch (err) {
    showFatalError('加载数据失败: ' + err.message);
  } finally {
    setLoading(false);
  }
}

// ════════════════════════════════════════════════════════════════════════════
// Render: column headers
// ════════════════════════════════════════════════════════════════════════════
function renderHeaders() {
  const hdr = document.getElementById('col-headers');
  hdr.innerHTML = '';

  // Index corner
  const corner = el('div', 'hdr-idx');
  corner.textContent = '#';
  hdr.appendChild(corner);

  // GT column header (using dirs[0] path)
  const gtHdr = el('div', 'hdr-col hdr-gt');
  gtHdr.innerHTML = `
    <div class="col-name col-name-gt">GT</div>
    <div class="col-dir" title="${escHtml(S.columns[0]?.dir || '')}">
      ${escHtml(S.columns[0]?.dir || '—')}
    </div>
  `;
  hdr.appendChild(gtHdr);

  // Gen column headers (one per experiment dir)
  S.columns.forEach((col, i) => {
    const cell = el('div', 'hdr-col');
    cell.innerHTML = `
      <div class="col-name">Exp ${i + 1}</div>
      <div class="col-dir" title="${escHtml(col.dir)}">${escHtml(col.label)}</div>
    `;
    hdr.appendChild(cell);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// Render: data rows
// ════════════════════════════════════════════════════════════════════════════
function renderRows() {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  if (!S.rows.length) {
    tbody.innerHTML = `<div class="empty-state">暂无数据（共 ${S.totalRows} 行）</div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  S.rows.forEach(row => {
    const rowEl = el('div', 'compare-row');

    // Row index (sticky left)
    const idxEl = el('div', 'cell-idx');
    idxEl.textContent = row.index;
    rowEl.appendChild(idxEl);

    // GT cell
    rowEl.appendChild(buildCell(row.gt, row.index, 'gt', 0));

    // Gen cells
    row.gens.forEach((gen, ei) => {
      rowEl.appendChild(buildCell(gen, row.index, 'gen', ei));
    });

    frag.appendChild(rowEl);
  });
  tbody.appendChild(frag);
}

// ════════════════════════════════════════════════════════════════════════════
// Build a single data cell
// ════════════════════════════════════════════════════════════════════════════
function buildCell(data, index, role, expIdx) {
  const isGt = role === 'gt';
  const cellEl = el('div', 'cell-data' + (isGt ? ' cell-gt' : ''));
  const filename = isGt ? `gt_${index}` : `gen_${index}`;

  // ── 1. PNG preview ──
  const pngSection = el('div', 'section-png');
  const pngLabel = el('span', 'section-label');
  pngLabel.textContent = filename + '.png';
  pngSection.appendChild(pngLabel);

  if (data.has_png) {
    const imgUrl = isGt
      ? `/api/image?index=${index}&role=gt`
      : `/api/image?index=${index}&role=gen&exp=${expIdx}`;
    const img = document.createElement('img');
    img.src = imgUrl;
    img.alt = filename + '.png';
    img.loading = 'lazy';
    pngSection.appendChild(img);
  } else {
    const noImg = el('div', 'no-img');
    noImg.textContent = '无预渲染图片';
    pngSection.appendChild(noImg);
  }
  cellEl.appendChild(pngSection);

  // ── 2. SVG source code ──
  const codeSection = el('div', 'section-code ' + (S.showCode ? 'expanded' : 'collapsed'));

  const codeHeader = el('div', 'code-header');
  const codeFilename = el('span', 'code-filename');
  codeFilename.textContent = filename + '.svg';
  codeFilename.title = filename + '.svg';

  const btnCopy = el('button', 'btn-copy');
  btnCopy.textContent = '复制';
  btnCopy.addEventListener('click', () => copyText(data.svg_code || '', btnCopy));

  codeHeader.appendChild(codeFilename);
  codeHeader.appendChild(btnCopy);
  codeSection.appendChild(codeHeader);

  const pre = document.createElement('pre');
  pre.className = 'code-pre';
  pre.textContent = data.svg_code || '（无内容）';
  codeSection.appendChild(pre);

  cellEl.appendChild(codeSection);

  // ── 3. Live SVG render ──
  const liveSection = el('div', 'section-live');
  liveSection.style.display = S.showLive ? '' : 'none';

  const liveHeader = el('div', 'section-live-header');
  liveHeader.textContent = '实时渲染 · ' + filename + '.svg';
  liveSection.appendChild(liveHeader);

  if (data.svg_code && data.svg_code.trim()) {
    const frame = document.createElement('iframe');
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.srcdoc = buildSvgPage(data.svg_code);
    liveSection.appendChild(frame);
  } else {
    const noSvg = el('div', 'no-svg');
    noSvg.textContent = '无 SVG 内容';
    liveSection.appendChild(noSvg);
  }

  cellEl.appendChild(liveSection);
  return cellEl;
}

// Build the srcdoc HTML page that renders the SVG centered
function buildSvgPage(svgCode) {
  return '<!DOCTYPE html><html><head><style>' +
    'html,body{margin:0;padding:6px;background:#fff;' +
    'display:flex;align-items:center;justify-content:center;' +
    'min-height:100%;box-sizing:border-box;}' +
    'svg{max-width:100%;max-height:206px;width:auto;height:auto;}' +
    '</style></head><body>' + svgCode + '</body></html>';
}

// ════════════════════════════════════════════════════════════════════════════
// Toggle: code / live render visibility
// ════════════════════════════════════════════════════════════════════════════
document.getElementById('btn-toggle-code').addEventListener('click', function () {
  S.showCode = !S.showCode;
  this.classList.toggle('on', S.showCode);
  document.querySelectorAll('.section-code').forEach(sec => {
    sec.classList.toggle('expanded', S.showCode);
    sec.classList.toggle('collapsed', !S.showCode);
  });
});

document.getElementById('btn-toggle-live').addEventListener('click', function () {
  S.showLive = !S.showLive;
  this.classList.toggle('on', S.showLive);
  document.querySelectorAll('.section-live').forEach(sec => {
    sec.style.display = S.showLive ? '' : 'none';
  });
});

// ════════════════════════════════════════════════════════════════════════════
// Pagination
// ════════════════════════════════════════════════════════════════════════════
function updatePagination() {
  const totalPages = Math.max(1, Math.ceil(S.totalRows / S.pageSize));
  document.getElementById('page-info').textContent =
    `第 ${S.page + 1} / ${totalPages} 页`;
  document.getElementById('row-count-badge').textContent =
    `共 ${S.totalRows.toLocaleString()} 行`;
  document.getElementById('btn-prev').disabled = (S.page === 0);
  document.getElementById('btn-next').disabled = (S.page >= totalPages - 1);
}

document.getElementById('btn-prev').addEventListener('click', async () => {
  if (S.page > 0) { S.page--; await loadPage(); }
});
document.getElementById('btn-next').addEventListener('click', async () => {
  const total = Math.ceil(S.totalRows / S.pageSize);
  if (S.page < total - 1) { S.page++; await loadPage(); }
});
document.getElementById('sel-page-size').addEventListener('change', async function () {
  S.pageSize = parseInt(this.value);
  S.page = 0;
  await loadPage();
});

// Keyboard navigation (←/→)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const total = Math.ceil(S.totalRows / S.pageSize);
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowUp') && S.page > 0) {
    e.preventDefault(); S.page--; loadPage();
  } else if ((e.key === 'ArrowRight' || e.key === 'ArrowDown') && S.page < total - 1) {
    e.preventDefault(); S.page++; loadPage();
  }
});

// ════════════════════════════════════════════════════════════════════════════
// Utilities
// ════════════════════════════════════════════════════════════════════════════
function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function setLoading(show) {
  document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
}

function showFatalError(msg) {
  document.getElementById('table-body').innerHTML =
    `<div class="empty-state empty-state-error">${escHtml(msg)}</div>`;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text || '').then(() => {
    btn.textContent = '已复制 ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '复制';
      btn.classList.remove('copied');
    }, 1600);
  }).catch(() => {
    btn.textContent = '失败';
    setTimeout(() => { btn.textContent = '复制'; }, 1200);
  });
}

// ════════════════════════════════════════════════════════════════════════════
// Start
// ════════════════════════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
