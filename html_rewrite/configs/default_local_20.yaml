# ── API ─────────────────────────────────────────────────────────────────────
url: "http://localhost:8000/v1/chat/completions"
api_key: "your-api-key-here"
model: "qwen3.6-27b"

timeout: 600.0
max_retries: 3
ssl_verify: false
log_user: "html_rewrite"

# ── 路径 ─────────────────────────────────────────────────────────────────────
# 推荐：模板展开 + run_root_dir 分片输出
input_dir: "/data/yanghaitao/Data/Code/FineWebEdu/raw/20260324/"
input_filename_template: "part2026-03-23-{index:05d}.jsonl"
input_start_index: 0                 # 包含
input_end_index_exclusive: 20         # 不包含
run_root_dir: "/data/yanghaitao/Data/Code/FineWebEdu/run/20260324_0_20/"
output_shard_name_template: "part2026-03-23-{index:05d}"

# 兼容旧模式：单文件或显式列表输入（二选一；与上面的模板模式不要同时用）
# input_path: "/data/yanghaitao/Data/Code/FineWebEdu/raw/part2026-03-23-00000.jsonl"
# input_paths:
#   - "/path/to/part-00000.jsonl"
#   - "/path/to/part-00001.jsonl"

# 旧模式输出路径（仅当未设置 run_root_dir 时使用）
# preprocessed_path: "/data/yanghaitao/Data/Code/FineWebEdu/html_rewrite/preprocessed.jsonl"
# output_path: "/data/yanghaitao/Data/Code/FineWebEdu/html_rewrite/output_kept.jsonl"
# reject_log_path: "/data/yanghaitao/Data/Code/FineWebEdu/html_rewrite/output_rejected.jsonl"
# call_log_path: "outputs/html_rewrite/html_rewrite_api_calls.jsonl"
# stats_log_path: "outputs/html_rewrite/html_rewrite_stats.jsonl"
# summary_log_path: "outputs/html_rewrite/html_rewrite_summary.json"
# stats_plot_dir: "outputs/html_rewrite/html_rewrite_plots"
stats_hist_bins: 120

# ── 预处理阈值 ────────────────────────────────────────────────────────────────
inline_script_max_chars: 4096
json_payload_max_chars: 4096
hidden_input_max_chars: 4096
html_comment_max_chars: 1024
inline_style_max_chars: 32768
min_preprocessed_chars: 1024
max_preprocessed_chars: 65536
fetch_media_size: true
enable_language_filter: true
allowed_languages: ["en"]
language_detector: "langid"
language_min_visible_text_chars: 200
language_min_letter_chars: 100
language_sample_max_chars: 12000
language_min_latin_ratio: 0.6
language_min_detector_margin: 3.0

# ── 生成参数（透传给 API payload）────────────────────────────────────────────
# generation_params: {}
# Qwen3.6-27B 官方推荐：
# thinking / precise coding (更适合 html rewrite):
generation_params:
  temperature: 0.6
  top_p: 0.95
  presence_penalty: 0.0
  max_tokens: 32768
  top_k: 20
#
# instruct / non-thinking:
#   temperature: 0.7
#   top_p: 0.8
#   presence_penalty: 1.5
#   max_tokens: 32768
#   top_k: 20
#   chat_template_kwargs:
#     enable_thinking: false

# ── Prompt ──────────────────────────────────────────────────────────────────
prompt_module: "html_rewrite"

# ── 运行时 ────────────────────────────────────────────────────────────────────
num_workers: 32
resume: true
