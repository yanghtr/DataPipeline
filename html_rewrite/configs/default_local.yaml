# ── API ─────────────────────────────────────────────────────────────────────
url: "http://localhost:8000/v1/chat/completions"
api_key: "your-api-key-here"
model: "your-model-name"

timeout: 120.0
max_retries: 3
ssl_verify: false
log_user: "html_rewrite"

# ── 路径 ─────────────────────────────────────────────────────────────────────
input_path: "/home/yanghaitao/Projects/Data/raw/FineWebEdu/samples10.jsonl"
preprocessed_path: "/home/yanghaitao/Projects/Data/html_rewrite/preprocessed.jsonl"
output_path: "/home/yanghaitao/Projects/Data/html_rewrite/output.jsonl"
call_log_path: "logs/html_rewrite_api_calls.jsonl"
stats_log_path: "logs/html_rewrite_stats.jsonl"
reject_log_path: "logs/html_rewrite_rejects.jsonl"
summary_log_path: "logs/html_rewrite_summary.json"
stats_plot_dir: "logs/html_rewrite_plots"

# ── 预处理阈值 ────────────────────────────────────────────────────────────────
inline_script_max_chars: 4096
json_payload_max_chars: 4096
hidden_input_max_chars: 4096
html_comment_max_chars: 1024
inline_style_max_chars: 32768
min_preprocessed_chars: 1024
max_preprocessed_chars: 65536
fetch_media_size: false

# ── 生成参数（透传给 API payload）────────────────────────────────────────────
generation_params: {}
# Qwen3.6-27B 官方推荐：
