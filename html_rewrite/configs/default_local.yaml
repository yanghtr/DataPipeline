#   top_p: 0.95
#   presence_penalty: 0.0
#   max_tokens: 32768
#   top_k: 20
#
# instruct / non-thinking:
#   temperature: 0.7
#   top_p: 0.8
#   presence_penalty: 1.5
#   max_tokens: 32768
#   top_k: 20
#   chat_template_kwargs:
#     enable_thinking: false

# ── Prompt ──────────────────────────────────────────────────────────────────
prompt_module: "html_rewrite"

# ── 运行时 ────────────────────────────────────────────────────────────────────
num_workers: 8
resume: true
